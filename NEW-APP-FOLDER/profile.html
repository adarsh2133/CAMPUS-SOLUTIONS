<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Stunnect</title>
    <link rel="icon" href="Stun-nect.jpeg">
    <link rel="stylesheet" href="profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="profile-container">
        <!-- Header with Navigation -->
        <header>
            <div class="nav-container">
                <div class="logo">
                    <h1>Stunnect</h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="new.html">Home</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="forum.html">Forum</a></li>
                        <li><a href="profile.html" class="active">Profile</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Profile Section -->
        <section class="profile-section">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-img-container">
                        <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="Profile Picture" class="profile-img">
                    </div>
                    <div class="profile-details">
                        <h2>John Doe</h2>
                        <p class="email">john.doe@example.com</p>
                        <div class="profile-bio">
                            <p>Student at IPU, Passionate about technology and learning new skills every day.</p>
                        </div>
                    </div>
                </div>
                <div class="profile-footer">
                    <button class="btn edit-btn">Edit Profile</button>
                    <button class="btn logout-btn">Logout</button>
                </div>
            </div>
        </section>

        <!-- Footer Section -->
        <footer>
            <div class="footer-content">
                <p>&copy; 2025 Stunnect. All Rights Reserved.</p>
                <div class="social-icons">
                    <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                    <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script src="profile.js"></script>
</body>

</html>
