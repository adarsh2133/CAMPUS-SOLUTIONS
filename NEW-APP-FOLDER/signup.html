<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Stunnect</title>
    <link rel="icon" href="Stun-nect.jpeg">
    <link rel="stylesheet" href="signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div style="align-items: center; font-size: 90px ; color: #232f3e; width: 200px; height: 200px; margin-right: 400px; ">Stunnect</div>
    <div class="signup-container">
        <div class="signup-box">
            <h2>Create Account</h2>
            <p class="intro-text">Join us to get started with your academic journey!</p>

            <form class="signup-form">
               
                <div class="input-group">
                    <input type="text" placeholder="Full Name" id="name" required>
                    <i class="fas fa-user"></i>
                </div>
               
                <div class="input-group">
                    <input type="email" placeholder="Email Address" id="email" required>
                    <i class="fas fa-envelope"></i>
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="Password" id="password" required>
                    <i class="fas fa-lock"></i>
                </div>
               
                <div class="input-group">
                    <input type="password" placeholder="Confirm Password" id="confirm-password" required>
                    <i class="fas fa-lock"></i>
                </div>
             
                <div class="input-group">
                    <label for="account-type">Account Type</label>
                    <select id="account-type">
                        <option value="student">Student</option>
                        <option value="teacher">Student-Freelance</option>
                    </select>
                </div>

            
                <div class="submit-btn">
                    <button type="submit" class="btn">Sign Up</button>
                </div>

              
                <div class="existing-account">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
