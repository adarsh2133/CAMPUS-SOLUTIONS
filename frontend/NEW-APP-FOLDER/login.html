<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stunnect</title>
    <link rel="icon" href="Stun-nect.jpeg">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div style="align-items: center; font-size: 90px ; color: #232f3e; width: 200px; height: 200px; margin-right: 400px; ">Stunnect</div>
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <p class="intro-text">Welcome back! Please login to continue your academic journey.</p>

            <form class="login-form">
                <!-- Email Address Input -->
                <div class="input-group">
                    <input type="email" placeholder="Email Address" id="email" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <!-- Password Input -->
                <div class="input-group">
                    <input type="password" placeholder="Password" id="password" required>
                    <i class="fas fa-lock"></i>
                </div>

                <!-- Submit Button -->
                <div class="submit-btn">
                    <button type="submit" class="btn">Login</button>
                </div>

                <!-- Forgot Password Link -->
                <div class="forgot-password">
                    <p><a href="#">Forgot Password?</a></p>
                </div>

                <!-- Create New Account -->
                <div class="new-account">
                    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
                </div>
            </form>
        </div>
    </div>  

    <script src="script.js"></script>
</body>

</html>
