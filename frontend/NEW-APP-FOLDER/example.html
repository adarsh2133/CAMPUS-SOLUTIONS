<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .typewriter {
      font-family: 'Courier New', Courier, monospace;
      font-size: 24px;
      font-weight: bold;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      border-right: 4px solid black;
      animation: typing 3s steps(80) 1s forwards, blink 0.75s step-end 100;
    }

    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>
<body>
  <div class="typewriter">Bhai, yeh smooth typewriter effect hai!</div>
</body>
</html>
