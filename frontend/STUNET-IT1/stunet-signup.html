<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STUNET - Secure student authentication portal">
    <meta name="theme-color" content="#0a0a0a">
    <title>STUNET - Sign Up</title>
    <link rel="stylesheet" href="stunet.css">
    <link rel="stylesheet" href="stunet-signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa3IW2lEnf3lGY6i7IeJI40W0yVxUQogQ5G92d8OxkZeP9c1bUSkb72l/qi9JLVLw3Jii9tcEKMOutZrZsw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="main-container">
        <div class="gradient-bg"></div>

        <div class="layout-wrapper">
            <!-- LEFT SECTION - BRANDING -->
            <section class="left-section" aria-hidden="true">
                <div class="chess-pieces-container signup-mode">
                    <!-- Queen Piece - Left -->
                    <div class="chess-piece queen-piece-wrapper signup-straight">
                        <img src="queen-piece.png" alt="Queen Chess Piece" class="chess-piece-img queen-piece" loading="lazy">
                    </div>
                    
                    <!-- Rook Piece - Center -->
                    <div class="chess-piece rook-piece-wrapper signup-straight">
                        <img src="rook-piece.png" alt="Rook Chess Piece" class="chess-piece-img rook-piece" loading="lazy">
                    </div>
                    
                    <!-- King Piece - Right -->
                    <div class="chess-piece king-piece-wrapper signup-straight">
                        <img src="king-piece.png" alt="King Chess Piece" class="chess-piece-img king-piece" loading="lazy">
                    </div>
                </div>
                <div id="three-container" role="presentation"></div>
                <div class="branding-content">
                    <div class="logo-wrapper">
                        <h1 class="logo-text">
                            <span class="logo-stu">STU</span><span class="logo-net">NET</span>
                        </h1>
                        <p class="tagline">
                            <span class="tagline-karma">STUDENT'S &nbsp; </span><span class="tagline-sarvoparri">OWNED NETWORK</span>
                        </p>
                    </div>
                </div>
            </section>

            <!-- RIGHT SECTION - SIGNUP FORM -->
            <main class="right-section">
                <div class="form-wrapper">
                    <article class="login-frame">
                        <header class="login-header">
                            <h2>Join STUNET</h2>
                            <p class="login-subtitle">Create your account to get started</p>
                        </header>

                        <form class="login-form" id="signupForm" novalidate>
                            <!-- Full Name Input -->
                            <div class="form-group">
                                <label for="fullname">Full Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="text" 
                                        id="fullname" 
                                        class="input-field"
                                        placeholder="John Doe" 
                                        required
                                        aria-describedby="fullnameError"
                                    >
                                </div>
                                <span class="error-message" id="fullnameError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Email Input -->
                            <div class="form-group">
                                <label for="email-signup">Email Address</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="email" 
                                        id="email-signup" 
                                        class="input-field"
                                        placeholder="you@example.com" 
                                        autocomplete="email"
                                        required
                                        aria-describedby="emailSignupError"
                                    >
                                </div>
                                <span class="error-message" id="emailSignupError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Password Input -->
                            <div class="form-group">
                                <label for="password-signup">Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="password" 
                                        id="password-signup" 
                                        class="input-field"
                                        placeholder="••••••••" 
                                        autocomplete="new-password"
                                        required
                                        aria-describedby="passwordSignupError"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle" 
                                        id="passwordToggleSignup"
                                        aria-label="Toggle password visibility"
                                        title="Show/hide password"
                                    >
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <span class="error-message" id="passwordSignupError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Confirm Password Input -->
                            <div class="form-group">
                                <label for="confirm-password">Confirm Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="password" 
                                        id="confirm-password" 
                                        class="input-field"
                                        placeholder="••••••••" 
                                        autocomplete="new-password"
                                        required
                                        aria-describedby="confirmPasswordError"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle" 
                                        id="confirmPasswordToggle"
                                        aria-label="Toggle password visibility"
                                        title="Show/hide password"
                                    >
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <span class="error-message" id="confirmPasswordError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Terms & Conditions -->
                            <div class="form-options">
                                <label class="remember-me">
                                    <input 
                                        type="checkbox" 
                                        id="agreeTerms"
                                        aria-label="Agree to terms and conditions"
                                        required
                                    >
                                    <span>I agree to the Terms & Conditions</span>
                                </label>
                            </div>

                            <!-- Sign Up Button -->
                            <button type="submit" class="btn-login" aria-label="Create account">
                                <span>Create Account</span>
                            </button>

                            <!-- Sign In Link -->
                            <div class="signup-text">
                                <p>Already have an account? <a href="stunet.html" class="signup-link" title="Sign in to account">Sign in</a></p>
                            </div>
                        </form>
                    </article>

                    <!-- Footer -->
                    <footer class="footer-text">
                        <p>Powered by <span>PinaakaAI</span></p>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <script src="stunet-signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
</body>
</html>
