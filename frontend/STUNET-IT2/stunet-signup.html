            <!-- RIGHT SECTION - SIGNUP FORM -->
            <main class="right-section">
                <div class="form-wrapper">
                    <article class="login-frame">
                        <header class="login-header">
                            <h2>Join <span class="stunet-word">STU</span><span class="net-word">NET</span></h2>
                            <p class="login-subtitle">Create your account to get started</p>
                        </header>

                        <form class="login-form" id="signupForm" novalidate>
                            <!-- Full Name Input -->
                            <div class="form-group">
                                <label for="fullname">Full Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="text" 
                                        id="fullname" 
                                        class="input-field"
                                        placeholder="John Doe" 
                                        required
                                        aria-describedby="fullnameError"
                                    >
                                </div>
                                <span class="error-message" id="fullnameError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Email Input -->
                            <div class="form-group">
                                <label for="email-signup">Email Address</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="email" 
                                        id="email-signup" 
                                        class="input-field"
                                        placeholder="you@example.com" 
                                        autocomplete="email"
                                        required
                                        aria-describedby="emailSignupError"
                                    >
                                </div>
                                <span class="error-message" id="emailSignupError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Password Input -->
                            <div class="form-group">
                                <label for="password-signup">Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="password" 
                                        id="password-signup" 
                                        class="input-field"
                                        placeholder="••••••••" 
                                        autocomplete="new-password"
                                        required
                                        aria-describedby="passwordSignupError"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle" 
                                        id="passwordToggleSignup"
                                        aria-label="Toggle password visibility"
                                        title="Show/hide password"
                                    >
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <span class="error-message" id="passwordSignupError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Confirm Password Input -->
                            <div class="form-group">
                                <label for="confirm-password">Confirm Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="password" 
                                        id="confirm-password" 
                                        class="input-field"
                                        placeholder="••••••••" 
                                        autocomplete="new-password"
                                        required
                                        aria-describedby="confirmPasswordError"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle" 
                                        id="confirmPasswordToggle"
                                        aria-label="Toggle password visibility"
                                        title="Show/hide password"
                                    >
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <span class="error-message" id="confirmPasswordError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Terms & Conditions -->
                            <div class="form-options">
                                <label class="remember-me">
                                    <input 
                                        type="checkbox" 
                                        id="agreeTerms"
                                        aria-label="Agree to terms and conditions"
                                        required
                                    >
                                    <span>I agree to the Terms & Conditions</span>
                                </label>
                            </div>

                            <!-- Sign Up Button -->
                            <button type="submit" class="btn-login" aria-label="Create account">
                                <span>Create Account</span>
                            </button>

                            <!-- Sign In Link -->
                            <div class="signup-text">
                                <p>Already have an account? <a href="stunet.html" class="signup-link" title="Sign in to account">Sign in</a></p>
                            </div>
                        </form>
                    </article>

                    <!-- Footer -->
                    <footer class="footer-text">
                        <p>Powered by <span>PinaakaAI</span></p>
                    </footer>
                </div>
            </main>
        </div>
    </div>
