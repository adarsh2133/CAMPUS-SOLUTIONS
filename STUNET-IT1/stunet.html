<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STUNET - Secure student authentication portal">
    <meta name="theme-color" content="#0a0a0a">
    <title>STUNET - Login</title>
    <link rel="stylesheet" href="stunet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa3IW2lEnf3lGY6i7IeJI40W0yVxUQogQ5G92d8OxkZeP9c1bUSkb72l/qi9JLVLw3Jii9tcEKMOutZrZsw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="main-container">
        <div class="gradient-bg"></div>

        <div class="layout-wrapper">
            <!-- LEFT SECTION - BRANDING -->
            <section class="left-section" aria-hidden="true">
                <div class="chess-pieces-container">
                    <!-- Queen Piece - Smaller, Tilted Left -->
                    <div class="chess-piece queen-piece-wrapper">
                        <img src="queen-piece.png" alt="Queen Chess Piece" class="chess-piece-img queen-piece" loading="lazy">
                    </div>
                    
                    <!-- King Piece - Larger, Tilted Right -->
                    <div class="chess-piece king-piece-wrapper">
                        <img src="king-piece.png" alt="King Chess Piece" class="chess-piece-img king-piece" loading="lazy">
                    </div>
                </div>
                <div id="three-container" role="presentation"></div>
                <div class="branding-content">
                    <div class="logo-wrapper">
                        <h1 class="logo-text">
                            <span class="logo-stu">STU</span><span class="logo-net">NET</span>
                        </h1>
                        <p class="tagline">
                            <span class="tagline-karma">STUDENT'S &nbsp; </span><span class="tagline-sarvoparri">OWNED NETWORK</span>
                        </p>
                    </div>
                </div>
            </section>

            <!-- RIGHT SECTION - LOGIN FORM -->
            <main class="right-section">
                <div class="form-wrapper">
                    <article class="login-frame">
                        <header class="login-header">
                            <h2>Welcome Back</h2>
                            <p class="login-subtitle">Sign in to your account</p>
                        </header>

                        <form class="login-form" id="loginForm" novalidate>
                            <!-- Email Input -->
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="email" 
                                        id="email" 
                                        class="input-field"
                                        placeholder="you@example.com" 
                                        autocomplete="email"
                                        required
                                        aria-describedby="emailError"
                                    >
                                </div>
                                <span class="error-message" id="emailError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Password Input -->
                            <div class="form-group">
                                <label for="password">Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                                    <input 
                                        type="password" 
                                        id="password" 
                                        class="input-field"
                                        placeholder="••••••••" 
                                        autocomplete="current-password"
                                        required
                                        aria-describedby="passwordError"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle" 
                                        id="passwordToggle"
                                        aria-label="Toggle password visibility"
                                        title="Show/hide password"
                                    >
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <span class="error-message" id="passwordError" role="alert" aria-live="polite"></span>
                            </div>

                            <!-- Remember & Forgot -->
                            <div class="form-options">
                                <label class="remember-me">
                                    <input 
                                        type="checkbox" 
                                        id="rememberMe"
                                        aria-label="Remember me on this device"
                                    >
                                    <span>Remember me</span>
                                </label>
                                <a href="#" class="forgot-link" title="Request password reset">Forgot Password?</a>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" class="btn-login" aria-label="Sign in to your account">
                                <span>Sign In</span>
                            </button>

                            <!-- Sign Up Link -->
                            <div class="signup-text">
                                <p>Don't have an account? <a href="stunet-signup.html" class="signup-link" title="Create new account">Create one</a></p>
                            </div>
                        </form>
                    </article>

                    <!-- Footer -->
                    <footer class="footer-text">
                        <p>Powered by <span>PinaakaAI</span></p>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <script src="stunet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
</body>
</html>
